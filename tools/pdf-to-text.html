<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Text | ToolPlay</title><meta name="description" content="Extract selectable text from every PDF page and download it as TXT."><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:25px}.card{max-width:720px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:12px}input{border:1px solid #d6ddea}button{border:0;background:#6d35e8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#out{margin-top:18px;padding:15px;background:#f0ebff;border-radius:12px;line-height:1.7}.download{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none}.muted{color:#667085}</style></head><body><div class="card"><h1>PDF to Text</h1><p class="muted">Extract selectable text from every PDF page and download it as TXT.</p><input id="file" type="file" accept="application/pdf"><button id="btn" disabled>Extract Text</button><div id="out">Select a PDF first.</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const file=document.getElementById('file'),btn=document.getElementById('btn'),out=document.getElementById('out');file.addEventListener('change',()=>{btn.disabled=!file.files[0];out.textContent=file.files[0]?`Selected: ${file.files[0].name}`:'Select a PDF first.'});btn.addEventListener('click',async()=>{try{const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.files[0].arrayBuffer())}).promise;let text=[];for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();text.push(c.items.map(x=>x.str).join(' '))}const value=text.join('\n\n').trim();out.innerHTML='';const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=value||'No selectable text found in this PDF.';out.append(pre);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([value],{type:'text/plain'}));a.download='extracted-text.txt';a.className='download';a.textContent='Download TXT';out.append(a)}catch(e){out.textContent='Text extraction failed. This PDF may be encrypted or unsupported.'}});</script></body></html>
