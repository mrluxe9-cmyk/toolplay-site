<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF | ToolPlay</title><meta name="description" content="Convert an image to a real PDF directly in your browser."><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:25px}.card{max-width:720px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:12px}input{border:1px solid #d6ddea}button{border:0;background:#6d35e8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#out{margin-top:18px;padding:15px;background:#f0ebff;border-radius:12px;line-height:1.7}.download{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none}.muted{color:#667085}</style></head><body><div class="card"><h1>Image to PDF</h1><p class="muted">Convert an image to a real PDF directly in your browser.</p><input id="file" type="file" accept="image/*"><button id="btn" disabled>Convert to PDF</button><div id="out">Select an image first.</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const file=document.getElementById('file'),btn=document.getElementById('btn'),out=document.getElementById('out');
file.addEventListener('change',()=>{btn.disabled=!file.files[0];out.textContent=file.files[0]?`Selected: ${file.files[0].name}`:'Select an image first.'});
btn.addEventListener('click',()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:im.width>=im.height?'landscape':'portrait',unit:'px',format:[im.width,im.height]});pdf.addImage(im,'JPEG',0,0,im.width,im.height);const blob=pdf.output('blob');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name.replace(/\.[^.]+$/,'')+'.pdf';a.textContent='Download PDF';a.className='download';out.innerHTML='Conversion complete. ';out.append(a)};im.src=e.target.result};r.readAsDataURL(f)});
</script></body></html>
