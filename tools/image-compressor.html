<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor | ToolPlay</title><meta name="description" content="Compress an image locally in your browser and download the result.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:28px 14px}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 8px 28px #00000012}
h1{font-size:clamp(34px,8vw,58px);line-height:1.08;margin:0 0 12px}
.sub{color:#667085;font-size:18px;line-height:1.5;margin:0 0 22px}
input,select,button{width:100%;padding:15px;border-radius:14px;font-size:17px}
input,select{border:1px solid #d6ddea;background:#fff}
input[type=file]{padding:12px}
button{margin-top:14px;border:0;background:#6d35e8;color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#f0ebff;line-height:1.65;font-weight:600;word-break:break-word}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.download{display:block;text-align:center;text-decoration:none;background:#172033;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:10px}
.small{font-size:14px;color:#667085;font-weight:500}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:18px 12px}.card{padding:22px}}
</style>
</head><body><main class="wrap"><section class="card"><h1>🗜️ Image Compressor</h1><p class="sub">Compress an image locally and download the smaller JPEG.</p><input id="file" type="file" accept="image/*"><label for="q">Quality: <b id="qv">70%</b></label><input id="q" type="range" min="0.1" max="1" step="0.05" value="0.7"><button id="go" disabled>Compress</button><div id="out" class="result">Select an image.</div></section></main><script>
const file=document.getElementById('file'),q=document.getElementById('q'),qv=document.getElementById('qv'),go=document.getElementById('go'),out=document.getElementById('out');
q.oninput=()=>qv.textContent=Math.round(q.value*100)+'%';
file.onchange=()=>{go.disabled=!file.files.length;out.textContent=file.files.length?'Selected: '+file.files[0].name:'Select an image.'};
go.onclick=()=>{const f=file.files[0];if(!f)return;go.disabled=true;out.textContent='Compressing…';const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>{if(!b){out.textContent='Compression failed.';go.disabled=false;return}const reduction=f.size?Math.max(0,100-(b.size/f.size*100)):0,url=URL.createObjectURL(b),a=document.createElement('a');a.className='download';a.href=url;a.download='compressed.jpg';a.textContent='Download compressed image';out.innerHTML=`Original: ${(f.size/1024).toFixed(1)} KB<br>Compressed: ${(b.size/1024).toFixed(1)} KB<br>Reduction: ${reduction.toFixed(1)}%`;out.appendChild(a);go.disabled=false},'image/jpeg',+q.value);URL.revokeObjectURL(u)};im.onerror=()=>{out.textContent='Could not read image.';go.disabled=false};im.src=u};
</script></body></html>
