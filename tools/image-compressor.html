<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Compressor | ToolPlay</title><meta name="description" content="Compress an image locally in your browser and download the result."><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:20px 14px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px #00000012}
h1{margin:0 0 8px}.sub{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea,button{width:100%;padding:13px;border-radius:12px;font-size:16px}input,select,textarea{border:1px solid #d6ddea}button{margin-top:14px;border:0;background:#6d35e8;color:#fff;font-weight:700}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#f0ebff;line-height:1.7;font-weight:650}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card">
<h1>Image Compressor</h1><p class="sub">Compress an image locally in your browser and download the result.</p><input id="file" type="file" accept="image/*"><label>Quality</label><input id="q" type="range" min=".1" max="1" step=".1" value=".7"><button onclick="go()">Compress</button><div id="out" class="result"></div></section></main><script>function go(){let f=file.files[0];if(!f)return;let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement('canvas'),x=c.getContext('2d');c.width=im.width;c.height=im.height;x.drawImage(im,0,0);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='compressed.jpg';a.textContent='Download compressed image';out.replaceChildren(a)},'image/jpeg',+q.value)};im.src=u}</script></body></html>
