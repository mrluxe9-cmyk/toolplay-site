<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Converter | ToolPlay</title><meta name="description" content="Convert images to JPG, PNG or WebP in your browser.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:28px 14px}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 8px 28px #00000012}
h1{font-size:clamp(34px,8vw,58px);line-height:1.08;margin:0 0 12px}
.sub{color:#667085;font-size:18px;line-height:1.5;margin:0 0 22px}
input,select,button{width:100%;padding:15px;border-radius:14px;font-size:17px}
input,select{border:1px solid #d6ddea;background:#fff}
input[type=file]{padding:12px}
button{margin-top:14px;border:0;background:#6d35e8;color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#f0ebff;line-height:1.65;font-weight:600;word-break:break-word}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.download{display:block;text-align:center;text-decoration:none;background:#172033;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:10px}
.small{font-size:14px;color:#667085;font-weight:500}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:18px 12px}.card{padding:22px}}
</style>
</head><body><main class="wrap"><section class="card"><h1>🖼️ Image Converter</h1><p class="sub">Convert an image to JPG, PNG or WebP locally in your browser.</p><input id="file" type="file" accept="image/*"><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select><button id="go" disabled>Convert</button><div id="out" class="result">Select an image.</div></section></main><script>
const file=document.getElementById('file'),format=document.getElementById('format'),
go=document.getElementById('go'),out=document.getElementById('out');

file.addEventListener('change',()=>{
  const ok=file.files.length>0;
  go.disabled=!ok;
  out.textContent=ok?'Selected: '+file.files[0].name:'Select an image.';
});

go.addEventListener('click',()=>{
  const f=file.files[0];
  if(!f)return;
  go.disabled=true;
  out.textContent='Converting…';
  const im=new Image();
  const u=URL.createObjectURL(f);

  im.onload=()=>{
    try{
      const c=document.createElement('canvas');
      c.width=im.naturalWidth;
      c.height=im.naturalHeight;
      const ctx=c.getContext('2d');
      if(!ctx)throw new Error('Canvas is not supported.');
      ctx.drawImage(im,0,0);

      const mime=format.value;
      const ext=mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg';

      c.toBlob(b=>{
        URL.revokeObjectURL(u);
        if(!b){
          out.textContent='Conversion failed.';
          go.disabled=false;
          return;
        }
        const url=URL.createObjectURL(b);
        const a=document.createElement('a');
        a.className='download';
        a.href=url;
        a.download='converted.'+ext;
        a.textContent='Download converted image';
        out.replaceChildren(a);
        go.disabled=false;
      },mime,mime==='image/png'?undefined:.92);
    }catch(e){
      URL.revokeObjectURL(u);
      out.textContent='Error: '+e.message;
      go.disabled=false;
    }
  };

  im.onerror=()=>{
    URL.revokeObjectURL(u);
    out.textContent='Could not read image.';
    go.disabled=false;
  };
  im.src=u;
});
</script></body></html>
