<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free Loan EMI Calculator. Calculate monthly EMI, total interest and total payment instantly.">
<title>Loan EMI Calculator - Tool Play</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.container{max-width:600px;margin:auto;padding:24px 16px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px #00000012}
h1{margin-top:0;font-size:28px}
label{display:block;margin:16px 0 7px;font-weight:600}
input{width:100%;padding:14px;border:1px solid #d8deea;border-radius:12px;font-size:16px}
button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:#673de6;color:white;font-size:17px;font-weight:bold}
.result{margin-top:22px;background:#f0edff;border-radius:16px;padding:18px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd}
.row:last-child{border:0}
.value{font-weight:bold}
.back{display:inline-block;margin-bottom:18px;text-decoration:none;color:#673de6;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<a class="back" href="../index.html">← Back to Tool Play</a>

<div class="card">
<h1>💰 Loan EMI Calculator</h1>
<p>Calculate your monthly EMI, total interest and total payment.</p>

<label for="amount">Loan Amount (₹)</label>
<input id="amount" type="number" placeholder="e.g. 500000">

<label for="rate">Annual Interest Rate (%)</label>
<input id="rate" type="number" step="0.01" placeholder="e.g. 10.5">

<label for="years">Loan Tenure (Years)</label>
<input id="years" type="number" step="0.1" placeholder="e.g. 5">

<button onclick="calculateEMI()">Calculate EMI</button>

<div id="result" class="result" hidden>
<div class="row"><span>Monthly EMI</span><span class="value" id="emi"></span></div>
<div class="row"><span>Total Interest</span><span class="value" id="interest"></span></div>
<div class="row"><span>Total Payment</span><span class="value" id="total"></span></div>
</div>
</div>
</div>

<script>
function money(n){
return "₹" + n.toLocaleString("en-IN",{maximumFractionDigits:2});
}

function calculateEMI(){
const P=parseFloat(document.getElementById("amount").value);
const annual=parseFloat(document.getElementById("rate").value);
const years=parseFloat(document.getElementById("years").value);

if(!P || !annual || !years || P<=0 || annual<0 || years<=0){
alert("Please enter valid loan details.");
return;
}

const n=Math.round(years*12);
const r=annual/12/100;

const emi=r===0
? P/n
: P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);

const total=emi*n;
const interest=total-P;

document.getElementById("emi").textContent=money(emi);
document.getElementById("interest").textContent=money(interest);
document.getElementById("total").textContent=money(total);
document.getElementById("result").hidden=false;
}
</script>
</body>
</html>
