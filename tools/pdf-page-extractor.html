<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Page Extractor | ToolPlay</title><meta name="description" content="Extract selected pages from a PDF into a new PDF."><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:25px}.card{max-width:720px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:12px}input{border:1px solid #d6ddea}button{border:0;background:#6d35e8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#out{margin-top:18px;padding:15px;background:#f0ebff;border-radius:12px;line-height:1.7}.download{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none}.muted{color:#667085}</style></head><body><div class="card"><h1>PDF Page Extractor</h1><p class="muted">Extract selected pages from a PDF into a new PDF.</p><input id="file" type="file" accept="application/pdf"><input id="pages" placeholder="Pages e.g. 1,3,5 or 2-4"><button id="btn" disabled>Extract Pages</button><div id="out">Select a PDF and page numbers.</div></div><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>const file=document.getElementById('file'),pages=document.getElementById('pages'),btn=document.getElementById('btn'),out=document.getElementById('out');function parsePages(s,max){const set=new Set();for(const part of s.split(',')){const x=part.trim();if(!x)continue;if(/^\d+-\d+$/.test(x)){let[a,b]=x.split('-').map(Number);if(a>b)[a,b]=[b,a];for(let i=a;i<=b;i++)if(i>=1&&i<=max)set.add(i)}else if(/^\d+$/.test(x)){const n=Number(x);if(n>=1&&n<=max)set.add(n)}}return [...set].sort((a,b)=>a-b)}file.addEventListener('change',()=>{btn.disabled=!file.files[0];out.textContent=file.files[0]?`Selected: ${file.files[0].name}`:'Select a PDF and page numbers.'});btn.addEventListener('click',async()=>{if(!file.files[0])return;try{const src=await PDFLib.PDFDocument.load(await file.files[0].arrayBuffer());const nums=parsePages(pages.value,src.getPageCount());if(!nums.length){out.textContent=`Enter valid page numbers from 1 to ${src.getPageCount()}.`;return}const dst=await PDFLib.PDFDocument.create();const copied=await dst.copyPages(src,nums.map(n=>n-1));copied.forEach(p=>dst.addPage(p));const bytes=await dst.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download='extracted-pages.pdf';a.className='download';a.textContent=`Download extracted PDF (${nums.length} page(s))`;out.innerHTML='Done. ';out.append(a)}catch(e){out.textContent='Extraction failed. Make sure the PDF is valid and not encrypted.'}});</script></body></html>
