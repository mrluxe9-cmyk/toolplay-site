<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Merger | ToolPlay</title><meta name="description" content="Merge multiple PDF files into one PDF in your browser.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:28px 14px}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 8px 28px #00000012}
h1{font-size:clamp(34px,8vw,58px);line-height:1.08;margin:0 0 12px}
.sub{color:#667085;font-size:18px;line-height:1.5;margin:0 0 22px}
input,select,button{width:100%;padding:15px;border-radius:14px;font-size:17px}
input,select{border:1px solid #d6ddea;background:#fff}
input[type=file]{padding:12px}
button{margin-top:14px;border:0;background:#6d35e8;color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#f0ebff;line-height:1.65;font-weight:600;word-break:break-word}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.download{display:block;text-align:center;text-decoration:none;background:#172033;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:10px}
.small{font-size:14px;color:#667085;font-weight:500}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:18px 12px}.card{padding:22px}}
</style>
</head><body><main class="wrap"><section class="card"><h1>📚 PDF Merger</h1><p class="sub">Select multiple PDFs and merge them into one file.</p><input id="files" type="file" accept="application/pdf" multiple><button id="go" disabled>Merge PDFs</button><div id="out" class="result">Select at least 2 PDF files.</div></section></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>
const filesEl=document.getElementById('files'),go=document.getElementById('go'),out=document.getElementById('out');
filesEl.onchange=()=>{go.disabled=filesEl.files.length<2;out.textContent=filesEl.files.length?`Selected ${filesEl.files.length} PDF file(s).`:'Select at least 2 PDF files.'};
go.onclick=async()=>{try{
 if(typeof PDFLib==='undefined')throw new Error('PDF engine failed to load. Refresh the page and try again.');
 go.disabled=true;out.textContent='Merging…';const dst=await PDFLib.PDFDocument.create();
 for(const f of filesEl.files){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const ps=await dst.copyPages(src,src.getPageIndices());ps.forEach(p=>dst.addPage(p));}
 const bytes=await dst.save(),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');
 a.className='download';a.href=url;a.download='merged.pdf';a.textContent='Download merged PDF';out.replaceChildren(a);
}catch(e){out.textContent='Error: '+e.message}finally{go.disabled=filesEl.files.length<2}};
</script></body></html>
