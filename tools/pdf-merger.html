<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Merger | ToolPlay</title><meta name="description" content="Merge multiple PDF files into one downloadable PDF."><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:25px}.card{max-width:720px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:12px}input{border:1px solid #d6ddea}button{border:0;background:#6d35e8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#out{margin-top:18px;padding:15px;background:#f0ebff;border-radius:12px;line-height:1.7}.download{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none}.muted{color:#667085}</style></head><body><div class="card"><h1>PDF Merger</h1><p class="muted">Merge multiple PDF files into one downloadable PDF.</p><input id="file" type="file" accept="application/pdf" multiple><button id="btn" disabled>Merge PDFs</button><div id="out">Select two or more PDF files.</div></div><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>const file=document.getElementById('file'),btn=document.getElementById('btn'),out=document.getElementById('out');file.addEventListener('change',()=>{btn.disabled=file.files.length<2;out.textContent=file.files.length?`Selected ${file.files.length} PDF file(s).`:'Select two or more PDF files.'});btn.addEventListener('click',async()=>{try{const merged=await PDFLib.PDFDocument.create();for(const f of file.files){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await merged.copyPages(src,src.getPageIndices());pages.forEach(p=>merged.addPage(p))}const bytes=await merged.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download='merged.pdf';a.className='download';a.textContent=`Download merged PDF (${merged.getPageCount()} pages)`;out.innerHTML='Merge complete. ';out.append(a)}catch(e){out.textContent='Merge failed. Make sure all files are valid, unencrypted PDFs.'}});</script></body></html>
