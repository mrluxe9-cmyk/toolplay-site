<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to JPG | ToolPlay</title><meta name="description" content="Render every PDF page as a high-quality JPG image in your browser."><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:25px}.card{max-width:720px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:12px}input{border:1px solid #d6ddea}button{border:0;background:#6d35e8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#out{margin-top:18px;padding:15px;background:#f0ebff;border-radius:12px;line-height:1.7}.download{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none}.muted{color:#667085}</style></head><body><div class="card"><h1>PDF to JPG</h1><p class="muted">Render every PDF page as a high-quality JPG image in your browser.</p><input id="file" type="file" accept="application/pdf"><button id="btn" disabled>Convert to JPG</button><div id="out">Select a PDF first.</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const file=document.getElementById('file'),btn=document.getElementById('btn'),out=document.getElementById('out');file.addEventListener('change',()=>{btn.disabled=!file.files[0];out.textContent=file.files[0]?`Selected: ${file.files[0].name}`:'Select a PDF first.'});btn.addEventListener('click',async()=>{try{const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.files[0].arrayBuffer())}).promise;out.innerHTML=`Rendering ${pdf.numPages} page(s)...`;for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),vp=page.getViewport({scale:1.5}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:ctx,viewport:vp}).promise;const a=document.createElement('a');a.href=canvas.toDataURL('image/jpeg',.92);a.download=`page-${i}.jpg`;a.className='download';a.textContent=`Download page ${i} JPG`;out.append(document.createElement('br'),a)}}catch(e){out.textContent='Conversion failed. This PDF may be encrypted or unsupported.'}});</script></body></html>
