<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Page Counter | ToolPlay</title><meta name="description" content="Count the exact number of pages in a PDF."><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:25px}.card{max-width:720px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:12px}input{border:1px solid #d6ddea}button{border:0;background:#6d35e8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#out{margin-top:18px;padding:15px;background:#f0ebff;border-radius:12px;line-height:1.7}.download{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none}.muted{color:#667085}</style></head><body><div class="card"><h1>PDF Page Counter</h1><p class="muted">Count the exact number of pages in a PDF.</p><input id="file" type="file" accept="application/pdf"><div id="out">Select a PDF first.</div></div><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>const file=document.getElementById('file'),out=document.getElementById('out');file.addEventListener('change',async()=>{const f=file.files[0];if(!f){out.textContent='Select a PDF first.';return}try{const pdf=await PDFLib.PDFDocument.load(await f.arrayBuffer());out.innerHTML=`File: <b>${f.name}</b><br>Size: ${(f.size/1024/1024).toFixed(2)} MB<br><strong>Pages: ${pdf.getPageCount()}</strong>`}catch(e){out.textContent='Could not read this PDF.'}});</script></body></html>
