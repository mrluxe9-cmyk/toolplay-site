<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Cropper | ToolPlay</title><meta name="description" content="Crop an image to a selected center rectangle.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:28px 14px}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 8px 28px #00000012}
h1{font-size:clamp(34px,8vw,58px);line-height:1.08;margin:0 0 12px}
.sub{color:#667085;font-size:18px;line-height:1.5;margin:0 0 22px}
input,select,button{width:100%;padding:15px;border-radius:14px;font-size:17px}
input,select{border:1px solid #d6ddea;background:#fff}
input[type=file]{padding:12px}
button{margin-top:14px;border:0;background:#6d35e8;color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#f0ebff;line-height:1.65;font-weight:600;word-break:break-word}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.download{display:block;text-align:center;text-decoration:none;background:#172033;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:10px}
.small{font-size:14px;color:#667085;font-weight:500}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:18px 12px}.card{padding:22px}}
</style>
</head><body><main class="wrap"><section class="card"><h1>✂️ Image Cropper</h1><p class="sub">Choose an image and crop a centered rectangle by width and height.</p><input id="file" type="file" accept="image/*"><div class="row"><input id="w" type="number" min="1" placeholder="Crop width (px)"><input id="h" type="number" min="1" placeholder="Crop height (px)"></div><button id="go" disabled>Crop Center</button><div id="out" class="result">Select an image.</div></section></main><script>
const file=document.getElementById('file'),w=document.getElementById('w'),
h=document.getElementById('h'),go=document.getElementById('go'),out=document.getElementById('out');

file.addEventListener('change',()=>{
  const ok=file.files.length>0;
  go.disabled=!ok;
  out.textContent=ok?'Selected: '+file.files[0].name:'Select an image.';
});

go.addEventListener('click',()=>{
  const f=file.files[0];
  if(!f)return;

  go.disabled=true;
  out.textContent='Cropping…';

  const im=new Image();
  const u=URL.createObjectURL(f);

  im.onload=()=>{
    try{
      let cw=parseInt(w.value,10)||im.naturalWidth;
      let ch=parseInt(h.value,10)||im.naturalHeight;
      if(cw<1||ch<1)throw new Error('Enter valid crop dimensions.');
      cw=Math.min(cw,im.naturalWidth);
      ch=Math.min(ch,im.naturalHeight);

      const sx=Math.floor((im.naturalWidth-cw)/2);
      const sy=Math.floor((im.naturalHeight-ch)/2);
      const c=document.createElement('canvas');
      c.width=cw;c.height=ch;

      const ctx=c.getContext('2d');
      if(!ctx)throw new Error('Canvas is not supported.');
      ctx.drawImage(im,sx,sy,cw,ch,0,0,cw,ch);

      c.toBlob(b=>{
        URL.revokeObjectURL(u);
        if(!b){
          out.textContent='Crop failed.';
          go.disabled=false;
          return;
        }
        const url=URL.createObjectURL(b);
        const a=document.createElement('a');
        a.className='download';
        a.href=url;
        a.download='cropped.jpg';
        a.textContent='Download cropped image';
        out.replaceChildren(a);
        go.disabled=false;
      },'image/jpeg',.92);
    }catch(e){
      URL.revokeObjectURL(u);
      out.textContent='Error: '+e.message;
      go.disabled=false;
    }
  };

  im.onerror=()=>{
    URL.revokeObjectURL(u);
    out.textContent='Could not read image.';
    go.disabled=false;
  };
  im.src=u;
});
</script></body></html>
