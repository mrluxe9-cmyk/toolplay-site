<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Splitter | ToolPlay</title>
<meta name="description" content="Split a PDF by selecting pages in your browser.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:24px 14px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:28px;
  box-shadow:0 8px 28px #00000012;
}

h1{
  font-size:clamp(34px,8vw,58px);
  line-height:1.08;
  margin:0 0 12px;
}

.sub{
  color:#667085;
  font-size:18px;
  line-height:1.5;
  margin:0 0 22px;
}

input{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:1px solid #d6ddea;
  border-radius:14px;
  background:#fff;
  font-size:17px;
}

input[type=file]{
  padding:12px;
}

button{
  width:100%;
  min-height:56px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  display:block;
  visibility:visible;
}

button:disabled{
  background:#94a3b8;
  color:#fff;
  opacity:1;
  cursor:not-allowed;
}

.result{
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:#f0ebff;
  line-height:1.65;
  font-weight:600;
  word-break:break-word;
}

.download{
  display:block;
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:#172033;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-weight:800;
}

@media(max-width:600px){
  .wrap{padding:18px 12px}
  .card{padding:22px}
}
</style>
</head>

<body>

<main class="wrap">
<section class="card">

<h1>📄 PDF Splitter</h1>

<p class="sub">
Select a PDF and choose the pages to create a new PDF.
</p>

<input
  id="file"
  type="file"
  accept="application/pdf,.pdf"
>

<input
  id="pages"
  type="text"
  inputmode="text"
  autocomplete="off"
  placeholder="Pages e.g. 1,3,5 or 2-4"
>

<button id="go" type="button">
Split PDF
</button>

<div id="out" class="result">
Select a PDF and enter page numbers.
</div>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
(function(){

const file = document.getElementById("file");
const pages = document.getElementById("pages");
const go = document.getElementById("go");
const out = document.getElementById("out");

function status(text){
  out.textContent = text;
}

function parsePages(value,total){

  const result = new Set();

  const parts = value
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);

  if(!parts.length){
    throw new Error("Enter page numbers.");
  }

  for(const part of parts){

    if(/^\\d+$/.test(part)){

      const n = Number(part);

      if(n < 1 || n > total){
        throw new Error(
          "Page " + n + " is outside this PDF. Total pages: " + total
        );
      }

      result.add(n);
      continue;
    }

    const range = part.match(/^(\\d+)\\s*-\\s*(\\d+)$/);

    if(range){

      let a = Number(range[1]);
      let b = Number(range[2]);

      if(a > b){
        [a,b] = [b,a];
      }

      if(a < 1 || b > total){
        throw new Error(
          "Range " + part +
          " is outside this PDF. Total pages: " + total
        );
      }

      for(let n=a;n<=b;n++){
        result.add(n);
      }

      continue;
    }

    throw new Error("Invalid page format: " + part);
  }

  return [...result].sort((a,b)=>a-b);
}

file.addEventListener("change",function(){

  if(file.files.length){

    status(
      "Selected: " +
      file.files[0].name +
      ". Enter page numbers."
    );

  }else{

    status("Select a PDF first.");

  }

});

pages.addEventListener("input",function(){

  if(file.files.length && pages.value.trim()){

    status(
      "Selected: " +
      file.files[0].name +
      ". Pages: " +
      pages.value.trim()
    );

  }

});

go.addEventListener("click",async function(){

  if(!file.files.length){

    status("Please select a PDF first.");
    return;

  }

  if(!pages.value.trim()){

    status(
      "Please enter pages, for example 1,3,5 or 2-4."
    );
    return;

  }

  if(typeof PDFLib === "undefined"){

    status(
      "PDF engine failed to load. Refresh the page and try again."
    );
    return;

  }

  go.disabled = true;
  status("Processing PDF...");

  try{

    const source = file.files[0];

    const bytes =
      await source.arrayBuffer();

    const pdf =
      await PDFLib.PDFDocument.load(bytes);

    const total =
      pdf.getPageCount();

    const selected =
      parsePages(pages.value,total);

    const output =
      await PDFLib.PDFDocument.create();

    const copied =
      await output.copyPages(
        pdf,
        selected.map(n=>n-1)
      );

    copied.forEach(page=>{
      output.addPage(page);
    });

    const result =
      await output.save();

    const blob =
      new Blob(
        [result],
        {type:"application/pdf"}
      );

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;
    link.download = "split-pages.pdf";
    link.className = "download";
    link.textContent = "⬇ Download split PDF";

    out.innerHTML =
      "Created " +
      selected.length +
      " page(s).";

    out.appendChild(link);

  }catch(error){

    console.error(error);

    status(
      "Error: " +
      (error.message || "Could not split PDF.")
    );

  }finally{

    go.disabled = false;

  }

});

})();
</script>

</body>
</html>
