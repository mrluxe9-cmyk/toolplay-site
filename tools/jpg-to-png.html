</style></head><body><main class="wrap"><section class="card">
<h1>JPG to PNG Converter</h1><p class="sub">Convert JPG images to PNG locally.</p><input id="file" type="file" accept="image/jpeg"><button onclick="go()">Convert</button><div id="out" class="result"></div></section></main><script>function go(){let f=file.files[0];if(!f)return;let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='converted.png';a.textContent='Download PNG';out.replaceChildren(a)},'image/png')};im.src=u}</script></body></html>
