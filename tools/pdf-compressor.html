<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Compressor</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f6fa;
  color:#172033;
}
.wrap{
  max-width:720px;
  margin:40px auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:28px;
  padding:40px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}
h1{
  margin:0 0 12px;
  font-size:42px;
}
.sub{
  color:#697386;
  font-size:18px;
  margin-bottom:28px;
}
input[type=file]{
  width:100%;
  padding:18px;
  border:2px solid #dfe3ea;
  border-radius:18px;
  font-size:16px;
  background:#fff;
}
.info{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#f0ebff;
  line-height:1.6;
}
button{
  width:100%;
  margin-top:18px;
  padding:17px;
  border:0;
  border-radius:16px;
  background:#6633e8;
  color:white;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.result{
  margin-top:22px;
  padding:20px;
  border-radius:18px;
  background:#eefbf3;
  display:none;
}
.download{
  display:block;
  text-align:center;
  text-decoration:none;
  margin-top:16px;
  padding:16px;
  border-radius:15px;
  background:#172033;
  color:#fff;
  font-weight:700;
}
.progress{
  margin-top:15px;
  color:#667085;
  text-align:center;
}
small{color:#667085}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>PDF Compressor</h1>

    <div class="sub">
      Compress a PDF directly in your browser.
      Your file is processed locally.
    </div>

    <input id="pdfFile" type="file" accept="application/pdf">

    <div id="fileInfo" class="info" style="display:none"></div>

    <button id="compressBtn" disabled>
      Compress PDF
    </button>

    <div id="progress" class="progress"></div>

    <div id="result" class="result">
      <strong>Compression complete</strong>
      <div id="resultText"></div>

      <a id="downloadBtn" class="download">
        Download Compressed PDF
      </a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
const fileInput = document.getElementById("pdfFile");
const fileInfo = document.getElementById("fileInfo");
const compressBtn = document.getElementById("compressBtn");
const progress = document.getElementById("progress");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");
const downloadBtn = document.getElementById("downloadBtn");

let selectedFile = null;

function formatSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

fileInput.addEventListener("change", () => {

  selectedFile = fileInput.files[0];

  result.style.display = "none";
  progress.textContent = "";

  if(!selectedFile){
    compressBtn.disabled = true;
    fileInfo.style.display = "none";
    return;
  }

  if(selectedFile.type !== "application/pdf"){
    alert("Please select a PDF file.");
    fileInput.value = "";
    compressBtn.disabled = true;
    return;
  }

  fileInfo.style.display = "block";

  fileInfo.innerHTML =
    "<strong>Selected:</strong> " +
    selectedFile.name +
    "<br>" +
    "<strong>Original size:</strong> " +
    formatSize(selectedFile.size);

  compressBtn.disabled = false;
});

compressBtn.addEventListener("click", async () => {

  if(!selectedFile) return;

  compressBtn.disabled = true;
  progress.textContent = "Compressing PDF...";

  try {

    const inputBytes = await selectedFile.arrayBuffer();

    const pdfDoc = await PDFLib.PDFDocument.load(inputBytes, {
      ignoreEncryption: false
    });

    /*
      Save using object streams.
      This can reduce PDF overhead without uploading
      the user's file to a server.
    */
    const compressedBytes = await pdfDoc.save({
      useObjectStreams: true,
      addDefaultPage: false
    });

    const originalSize = selectedFile.size;
    const compressedSize = compressedBytes.length;

    const blob = new Blob(
      [compressedBytes],
      {type:"application/pdf"}
    );

    const url = URL.createObjectURL(blob);

    const reduction =
      originalSize > 0
      ? Math.max(
          0,
          ((originalSize - compressedSize) / originalSize) * 100
        )
      : 0;

    result.style.display = "block";

    resultText.innerHTML =
      "<br>Before: <strong>" +
      formatSize(originalSize) +
      "</strong>" +

      "<br>After: <strong>" +
      formatSize(compressedSize) +
      "</strong>" +

      "<br>Reduction: <strong>" +
      reduction.toFixed(1) +
      "%</strong>";

    downloadBtn.href = url;

    const baseName =
      selectedFile.name.replace(/\.pdf$/i,"");

    downloadBtn.download =
      baseName + "-compressed.pdf";

    progress.textContent =
      "Done — your PDF is ready.";

  } catch(error){

    console.error(error);

    progress.textContent = "";

    alert(
      "Compression failed. This PDF may be encrypted or unsupported."
    );

  } finally {

    compressBtn.disabled = false;

  }
});
</script>

</body>
</html>
