<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area Calculator | ToolPlay</title><meta name="description" content="Calculate area of rectangle, triangle or circle."><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:20px 14px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px #00000012}
h1{margin:0 0 8px}.sub{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea,button{width:100%;padding:13px;border-radius:12px;font-size:16px}input,select,textarea{border:1px solid #d6ddea}button{margin-top:14px;border:0;background:#6d35e8;color:#fff;font-weight:700}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#f0ebff;line-height:1.7;font-weight:650}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card">
<h1>Area Calculator</h1><p class="sub">Calculate area of rectangle, triangle or circle.</p><select id="shape"><option value="r">Rectangle</option><option value="t">Triangle</option><option value="c">Circle</option></select><input id="a" type="number" placeholder="Length / base / radius"><input id="b" type="number" placeholder="Width / height"><button onclick="go()">Calculate</button><div id="out" class="result"></div></section></main><script>function go(){let x=+a.value,y=+b.value,s=shape.value,v=s==='r'?x*y:s==='t'?x*y/2:Math.PI*x*x;out.textContent=`Area: ${v.toFixed(2)}`}</script></body></html>
