<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact ToolPlay</title>
<meta name="description" content="Get in touch with the ToolPlay team.">
<link rel="canonical" href="https://mrluxe9-cmyk.github.io/toolplay-site/contact.html">
<meta name="theme-color" content="#2563EB">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="tp-header"></div>
<main>
  <div class="container content-block" style="padding:40px 0">
    <h1>Contact Us</h1>
    <p style="color:var(--text-muted)">Questions, bug reports, or a tool/game you'd like to see? Send a message below — it opens a pre-filled GitHub issue so you can send the details easily.</p>
    <div class="tool-card">
      <div class="field"><label for="c-name">Name</label><input type="text" id="c-name"></div>
      <div class="field" style="margin-top:14px"><label for="c-email">Email</label><input type="email" id="c-email"></div>
      <div class="field" style="margin-top:14px"><label for="c-msg">Message</label><textarea id="c-msg" placeholder="How can we help?"></textarea></div>
      <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="sendContact()">Send Message</button>
    </div>
  </div>
</main>
<div id="tp-footer"></div>
<div id="tp-bottom-nav"></div>
<script>window.TP_ROOT='';window.TP_ACTIVE='contact';</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  function sendContact(){
    const name = document.getElementById('c-name').value.trim();
    const email = document.getElementById('c-email').value.trim();
    const msg = document.getElementById('c-msg').value.trim();
    if (!email || !msg){ tpToast('Please add your email and a message'); return; }
    const subject = encodeURIComponent('ToolPlay contact from ' + (name || email));
    const body = encodeURIComponent(msg + '\n\n— ' + (name || 'Anonymous') + ' (' + email + ')');
    window.location.href = `https://github.com/mrluxe9-cmyk/toolplay-site/issues/new?title=${subject}&body=${body}`;
  }
</script>
</body>
</html>
