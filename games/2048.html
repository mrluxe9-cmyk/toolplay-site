<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Play Free Online | ToolPlay</title>
<meta name="description" content="Play 2048 free online. Slide and merge numbered tiles to reach the 2048 tile — works on mobile and desktop.">
<link rel="canonical" href="https://mrluxe9-cmyk.github.io/toolplay-site/games/2048.html">
<meta name="theme-color" content="#7C3AED">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
</head>
<body>
<div id="tp-header"></div>
<main>
  <div class="container tool-page-head">
    <span class="badge game">Game</span>
    <h1>2048</h1>
    <p style="color:var(--text-muted)">Slide and merge tiles to reach 2048.</p>
  </div>

  <div class="container">
    <div class="game-shell">
      <div class="game-hud">
        <div class="game-scores">
          <div class="chip">Score: <span id="score">0</span></div>
          <div class="chip">Best: <span id="best">0</span></div>
        </div>
        <div class="game-controls">
          <button class="btn btn-outline btn-sm" onclick="restartGame()">Restart</button>
        </div>
      </div>
      <div class="game-stage" style="min-height:auto;background:transparent">
        <div id="g2048-board"></div>
        <div class="game-overlay hidden" id="g2048-overlay">
          <h2 id="g2048-overlay-text"></h2>
          <button class="btn btn-primary" onclick="restartGame()">Try Again</button>
        </div>
      </div>

      <div class="how-to-play">
        <h3>How to play</h3>
        <ul>
          <li>Desktop: use arrow keys to slide all tiles in a direction.</li>
          <li>Mobile: swipe on the board.</li>
          <li>Tiles with the same number merge into one when they touch. Reach 2048 to win!</li>
        </ul>
      </div>
    </div>
    <div class="ad-slot rect">Ad space</div>
  </div>
</main>
<div id="tp-footer"></div>
<div id="tp-bottom-nav"></div>

<script>window.TP_ROOT='../';window.TP_ACTIVE='games';</script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  tpTrackRecent('2048');
  const SIZE = 4;
  const BEST_KEY = 'tp_best_2048';
  let grid, score, won, startTime;

  function loadBest(){ return parseInt(localStorage.getItem(BEST_KEY) || '0', 10); }
  document.getElementById('best').textContent = loadBest();

  function emptyGrid(){ return Array.from({length:SIZE}, () => Array(SIZE).fill(0)); }

  function addRandomTile(){
    const empties = [];
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (grid[r][c]===0) empties.push([r,c]);
    if (!empties.length) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render(){
    const board = document.getElementById('g2048-board');
    board.innerHTML = '';
    for (let r=0;r<SIZE;r++){
      for (let c=0;c<SIZE;c++){
        const v = grid[r][c];
        const tile = document.createElement('div');
        tile.className = 'g2048-tile';
        tile.dataset.v = v;
        tile.textContent = v || '';
        if (v) tile.style.background = tileColor(v);
        board.appendChild(tile);
      }
    }
    document.getElementById('score').textContent = score;
  }

  function tileColor(v){
    const shades = {2:'#DBEAFE',4:'#BFDBFE',8:'#93C5FD',16:'#60A5FA',32:'#3B82F6',64:'#2563EB',128:'#C4B5FD',256:'#A78BFA',512:'#8B5CF6',1024:'#7C3AED',2048:'#6D28D9'};
    return shades[v] || '#4C1D95';
  }

  function slideRow(row){
    let arr = row.filter(v => v !== 0);
    let gained = 0;
    for (let i=0;i<arr.length-1;i++){
      if (arr[i] === arr[i+1]){
        arr[i] *= 2;
        gained += arr[i];
        arr.splice(i+1,1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return {row: arr, gained};
  }

  function rotateGrid(g){
    const newGrid = emptyGrid();
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) newGrid[c][SIZE-1-r] = g[r][c];
    return newGrid;
  }

  function move(direction){
    // Normalize to "left" by rotating, slide, rotate back.
    let rotations = {left:0, up:3, right:2, down:1}[direction];
    let g = grid;
    for (let i=0;i<rotations;i++) g = rotateGrid(g);

    let moved = false, gainedTotal = 0;
    const newG = g.map(row => {
      const before = row.join(',');
      const {row: newRow, gained} = slideRow(row);
      if (newRow.join(',') !== before) moved = true;
      gainedTotal += gained;
      return newRow;
    });

    let result = newG;
    for (let i=0;i<(4-rotations)%4;i++) result = rotateGrid(result);

    if (moved){
      grid = result;
      score += gainedTotal;
      addRandomTile();
      render();
      if (!won && grid.flat().includes(2048)){
        won = true;
        showOverlay('You reached 2048! 🎉', true);
      } else if (!canMove()){
        showOverlay('Game Over', false);
      }
    }
  }

  function canMove(){
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
      if (grid[r][c] === 0) return true;
      if (c<SIZE-1 && grid[r][c] === grid[r][c+1]) return true;
      if (r<SIZE-1 && grid[r][c] === grid[r+1][c]) return true;
    }
    return false;
  }

  function showOverlay(text, isWin){
    const best = Math.max(loadBest(), score);
    localStorage.setItem(BEST_KEY, best);
    document.getElementById('best').textContent = best;
    document.getElementById('g2048-overlay-text').textContent = text;
    document.getElementById('g2048-overlay').classList.remove('hidden');
    tpTrack(isWin ? 'game_complete' : 'game_over', { game_name: '2048', score: score, duration: Math.round((Date.now()-startTime)/1000) });
  }

  document.addEventListener('keydown', (e) => {
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if (map[e.key]){ e.preventDefault(); move(map[e.key]); }
  });

  let touchStart = null;
  const board = document.getElementById('g2048-board');
  board.addEventListener('touchstart', (e) => { touchStart = e.touches[0]; }, {passive:true});
  board.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.clientX;
    const dy = e.changedTouches[0].clientY - touchStart.clientY;
    if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, {passive:true});

  function restartGame(){
    grid = emptyGrid();
    score = 0; won = false; startTime = Date.now();
    addRandomTile(); addRandomTile();
    document.getElementById('g2048-overlay').classList.add('hidden');
    render();
    tpTrack('game_restart', { game_name: '2048' });
  }

  restartGame();
  tpTrack('game_start', { game_name: '2048' });
</script>
</body>
</html>
